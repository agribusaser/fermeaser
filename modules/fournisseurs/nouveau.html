<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nouveau fournisseur | Ferme Asher ERP</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="../../css/fournisseurs.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container-fluid py-4">

<!-- =========================================
     EN-TÊTE
========================================= -->

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2>

<i class="fa-solid fa-building-circle-plus"></i>

Nouveau fournisseur

</h2>

<p class="text-muted">

Enregistrer un nouveau fournisseur

</p>

</div>

<a
href="index.html"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Retour

</a>

</div>


<!-- =========================================
     FORMULAIRE
========================================= -->

<div class="row justify-content-center">

<div class="col-xl-9 col-lg-10">

<div class="card shadow-sm border-0">

<div class="card-header bg-success text-white">

<h5 class="mb-0">

<i class="fa-solid fa-truck-field"></i>

Informations du fournisseur

</h5>

</div>

<div class="card-body">

<form id="fournisseurForm">

<!-- =====================================
     IDENTIFICATION
===================================== -->

<div class="alert alert-success">

<i class="fa-solid fa-circle-info"></i>

Le numéro fournisseur sera attribué
automatiquement après l'enregistrement.

</div>


<div class="row">

<div class="col-md-6 mb-3">

<label
for="nom"
class="form-label">

Nom / Entreprise *

</label>

<input
type="text"
id="nom"
class="form-control"
placeholder="Nom du fournisseur ou entreprise"
required>

</div>


<div class="col-md-6 mb-3">

<label
for="type"
class="form-label">

Type de fournisseur

</label>

<select
id="type"
class="form-select">

<option value="Entreprise">

Entreprise

</option>

<option value="Particulier">

Particulier

</option>

<option value="Producteur">

Producteur

</option>

<option value="Grossiste">

Grossiste

</option>

<option value="Distributeur">

Distributeur

</option>

</select>

</div>

</div>


<!-- =====================================
     CONTACT
===================================== -->

<div class="row">

<div class="col-md-6 mb-3">

<label
for="telephone"
class="form-label">

Téléphone *

</label>

<input
type="tel"
id="telephone"
class="form-control"
placeholder="+243..."
required>

</div>


<div class="col-md-6 mb-3">

<label
for="email"
class="form-label">

Email

</label>

<input
type="email"
id="email"
class="form-control"
placeholder="email@exemple.com">

</div>

</div>


<!-- =====================================
     LOCALISATION
===================================== -->

<div class="row">

<div class="col-md-6 mb-3">

<label
for="adresse"
class="form-label">

Adresse

</label>

<input
type="text"
id="adresse"
class="form-control"
placeholder="Adresse">

</div>


<div class="col-md-3 mb-3">

<label
for="ville"
class="form-label">

Ville

</label>

<input
type="text"
id="ville"
class="form-control"
placeholder="Lubumbashi">

</div>


<div class="col-md-3 mb-3">

<label
for="pays"
class="form-label">

Pays

</label>

<input
type="text"
id="pays"
class="form-control"
value="RDC">

</div>

</div>


<!-- =====================================
     STATUT
===================================== -->

<div class="row">

<div class="col-md-6 mb-3">

<label
for="statut"
class="form-label">

Statut

</label>

<select
id="statut"
class="form-select">

<option value="Actif">

Actif

</option>

<option value="Inactif">

Inactif

</option>

</select>

</div>

</div>


<!-- =====================================
     NOTES
===================================== -->

<div class="mb-4">

<label
for="notes"
class="form-label">

Notes

</label>

<textarea
id="notes"
class="form-control"
rows="4"
placeholder="Informations complémentaires sur le fournisseur..."></textarea>

</div>


<!-- =====================================
     ACTIONS
===================================== -->

<div class="d-flex justify-content-end gap-2">

<a
href="index.html"
class="btn btn-secondary">

<i class="fa-solid fa-xmark"></i>

Annuler

</a>

<button
type="submit"
class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer le fournisseur

</button>

</div>

</form>

</div>

</div>

</div>

</div>


<!-- =========================================
     FOOTER
========================================= -->

<div class="text-center mt-5 text-muted">

<small>

Ferme Asher ERP — Gestion des fournisseurs

</small>

</div>

</div>


<script src="../../js/fournisseurs.js"></script>

<script>

initialiserFormulaireFournisseur();

</script>

</body>

</html>
