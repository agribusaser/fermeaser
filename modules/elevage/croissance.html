<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Croissance | Ferme Asher ERP</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="../../css/elevage.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body class="bg-light">


<div class="container-fluid py-4">


<!-- EN-TÊTE -->

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2>

<i class="fa-solid fa-weight-scale text-primary"></i>

Suivi de croissance

</h2>

<p class="text-muted">

Suivez le poids et l'évolution de vos lots.

</p>

</div>


<div>

<a
href="index.html"
class="btn btn-secondary me-2">

<i class="fa-solid fa-arrow-left"></i>

Retour

</a>


<button
class="btn btn-success"
data-bs-toggle="modal"
data-bs-target="#modalCroissance">

<i class="fa-solid fa-plus"></i>

Nouvelle mesure

</button>

</div>

</div>



<!-- STATISTIQUES -->

<div class="row mb-4">


<div class="col-md-4 mb-3">

<div class="card shadow-sm border-0 text-center">

<div class="card-body">

<i class="fa-solid fa-weight-scale fa-2x text-primary mb-2"></i>

<h3 id="poidsMoyenGeneral">

0 Kg

</h3>

<p class="mb-0">

Poids moyen général

</p>

</div>

</div>

</div>



<div class="col-md-4 mb-3">

<div class="card shadow-sm border-0 text-center">

<div class="card-body">

<i class="fa-solid fa-layer-group fa-2x text-success mb-2"></i>

<h3 id="lotsMesures">

0

</h3>

<p class="mb-0">

Lots mesurés

</p>

</div>

</div>

</div>



<div class="col-md-4 mb-3">

<div class="card shadow-sm border-0 text-center">

<div class="card-body">

<i class="fa-solid fa-chart-line fa-2x text-warning mb-2"></i>

<h3 id="nombreMesures">

0

</h3>

<p class="mb-0">

Mesures enregistrées

</p>

</div>

</div>

</div>


</div>



<!-- TABLEAU -->

<div class="card shadow-sm border-0">

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead class="table-success">

<tr>

<th>Date</th>

<th>Lot</th>

<th>Nombre pesé</th>

<th>Poids total</th>

<th>Poids moyen</th>

<th>Notes</th>

<th>Action</th>

</tr>

</thead>


<tbody id="listeCroissance">

</tbody>


</table>

</div>

</div>

</div>


</div>



<!-- MODAL -->

<div
class="modal fade"
id="modalCroissance"
tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">


<div class="modal-header bg-success text-white">

<h5 class="modal-title">

<i class="fa-solid fa-weight-scale"></i>

Nouvelle mesure

</h5>


<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>



<div class="modal-body">


<form id="formCroissance">


<div class="mb-3">

<label class="form-label">

Date

</label>

<input
type="date"
id="croissanceDate"
class="form-control"
required>

</div>



<div class="mb-3">

<label class="form-label">

Lot

</label>

<select
id="croissanceLot"
class="form-select"
required>

<option value="">

Sélectionner un lot

</option>

</select>

</div>



<div class="row">


<div class="col-md-6 mb-3">

<label class="form-label">

Nombre d'animaux pesés

</label>

<input
type="number"
id="croissanceNombre"
class="form-control"
min="1"
required>

</div>



<div class="col-md-6 mb-3">

<label class="form-label">

Poids total (Kg)

</label>

<input
type="number"
id="croissancePoids"
class="form-control"
min="0.01"
step="0.01"
required>

</div>


</div>



<div class="mb-3">

<label class="form-label">

Notes

</label>

<textarea
id="croissanceNotes"
class="form-control"
rows="3">

</textarea>

</div>


</form>


</div>



<div class="modal-footer">

<button
type="button"
class="btn btn-secondary"
data-bs-dismiss="modal">

Annuler

</button>


<button
type="button"
class="btn btn-success"
onclick="enregistrerCroissance()">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer

</button>

</div>


</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">

</script>

<script src="../../js/elevage.js"></script>


<script>

document.addEventListener(
"DOMContentLoaded",
function () {

    document.getElementById("croissanceDate").value =
        new Date().toISOString().split("T")[0];

    chargerCroissance();

    chargerLotsCroissance();

});

</script>


</body>

</html>
