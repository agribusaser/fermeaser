<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animaux & Lots | Ferme Asher ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../../css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

<div class="container-fluid py-4">


<!-- EN-TÊTE -->

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2>

            <i class="fa-solid fa-cow"></i>

            Animaux & Lots

        </h2>

        <p class="text-muted">

            Gérez les espèces et les différents lots de votre élevage.

        </p>

    </div>


    <div>

        <a href="index.html"
           class="btn btn-secondary me-2">

            <i class="fa-solid fa-arrow-left"></i>

            Retour

        </a>


        <button class="btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#modalLot">

            <i class="fa-solid fa-plus"></i>

            Nouveau lot

        </button>

    </div>

</div>



<!-- STATISTIQUES -->

<div class="row mb-4">


    <div class="col-lg-3 col-md-6 mb-3">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <i class="fa-solid fa-paw fa-2x text-success mb-2"></i>

                <h3 id="totalAnimaux">

                    0

                </h3>

                <p class="text-muted mb-0">

                    Animaux

                </p>

            </div>

        </div>

    </div>



    <div class="col-lg-3 col-md-6 mb-3">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <i class="fa-solid fa-layer-group fa-2x text-primary mb-2"></i>

                <h3 id="nombreLots">

                    0

                </h3>

                <p class="text-muted mb-0">

                    Lots

                </p>

            </div>

        </div>

    </div>



    <div class="col-lg-3 col-md-6 mb-3">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <i class="fa-solid fa-heart-pulse fa-2x text-success mb-2"></i>

                <h3 id="animauxActifs">

                    0

                </h3>

                <p class="text-muted mb-0">

                    Animaux actifs

                </p>

            </div>

        </div>

    </div>



    <div class="col-lg-3 col-md-6 mb-3">

        <div class="card shadow-sm border-0">

            <div class="card-body text-center">

                <i class="fa-solid fa-skull-crossbones fa-2x text-danger mb-2"></i>

                <h3 id="totalMortalite">

                    0

                </h3>

                <p class="text-muted mb-0">

                    Mortalité

                </p>

            </div>

        </div>

    </div>


</div>



<!-- FILTRES -->

<div class="card shadow-sm border-0 mb-4">

    <div class="card-body">

        <div class="row g-3">


            <div class="col-lg-5">

                <input type="text"
                       id="rechercheAnimal"
                       class="form-control"
                       placeholder="Rechercher un lot ou une espèce...">

            </div>


            <div class="col-lg-3">

                <select id="filtreEspece"
                        class="form-select">

                    <option value="">

                        Toutes les espèces

                    </option>

                </select>

            </div>


            <div class="col-lg-2">

                <select id="filtreStatut"
                        class="form-select">

                    <option value="">

                        Tous les statuts

                    </option>

                    <option value="Actif">

                        Actif

                    </option>

                    <option value="Terminé">

                        Terminé

                    </option>

                </select>

            </div>


            <div class="col-lg-2">

                <button class="btn btn-success w-100"
                        onclick="chargerLots()">

                    <i class="fa-solid fa-rotate"></i>

                    Actualiser

                </button>

            </div>


        </div>

    </div>

</div>



<!-- TABLEAU DES LOTS -->

<div class="card shadow-sm border-0">

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-success">

                    <tr>

                        <th>Code</th>

                        <th>Espèce</th>

                        <th>Race / Type</th>

                        <th>Nom du lot</th>

                        <th>Date d'entrée</th>

                        <th>Quantité initiale</th>

                        <th>Quantité actuelle</th>

                        <th>Statut</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="listeLots">

                </tbody>

            </table>

        </div>

    </div>

</div>


</div>



<!-- MODAL NOUVEAU LOT -->

<div class="modal fade"
     id="modalLot"
     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <div class="modal-header bg-success text-white">

                <h5 class="modal-title">

                    <i class="fa-solid fa-plus"></i>

                    Nouveau lot d'animaux

                </h5>


                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">

                </button>

            </div>



            <div class="modal-body">


                <form id="formLot">


                    <div class="row g-3">


                        <!-- ESPECE -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Espèce

                            </label>


                            <select id="lotEspece"
                                    class="form-select"
                                    required>

                                <option value="">

                                    Sélectionner

                                </option>

                                <option value="Cailles">

                                    Cailles

                                </option>

                                <option value="Poules">

                                    Poules

                                </option>

                                <option value="Poulets de chair">

                                    Poulets de chair

                                </option>

                                <option value="Pondeuses">

                                    Pondeuses

                                </option>

                                <option value="Autre">

                                    Autre

                                </option>

                            </select>

                        </div>



                        <!-- RACE -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Race / Type

                            </label>


                            <input type="text"
                                   id="lotRace"
                                   class="form-control"
                                   placeholder="Exemple : Kuroiler F1">

                        </div>



                        <!-- NOM DU LOT -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Nom du lot

                            </label>


                            <input type="text"
                                   id="lotNom"
                                   class="form-control"
                                   placeholder="Exemple : Kuroiler Août 2026"
                                   required>

                        </div>



                        <!-- DATE -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Date d'entrée

                            </label>


                            <input type="date"
                                   id="lotDateEntree"
                                   class="form-control"
                                   required>

                        </div>



                        <!-- QUANTITE -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Quantité initiale

                            </label>


                            <input type="number"
                                   id="lotQuantite"
                                   class="form-control"
                                   min="1"
                                   required>

                        </div>



                        <!-- ORIGINE -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Origine

                            </label>


                            <select id="lotOrigine"
                                    class="form-select">

                                <option value="Achat">

                                    Achat

                                </option>

                                <option value="Naissance">

                                    Naissance / Éclosion

                                </option>

                                <option value="Transfert">

                                    Transfert

                                </option>

                                <option value="Autre">

                                    Autre

                                </option>

                            </select>

                        </div>



                        <!-- COUT -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Coût d'acquisition

                            </label>


                            <input type="number"
                                   id="lotCout"
                                   class="form-control"
                                   min="0"
                                   value="0">

                        </div>



                        <!-- STATUT -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Statut

                            </label>


                            <select id="lotStatut"
                                    class="form-select">

                                <option value="Actif">

                                    Actif

                                </option>

                                <option value="Terminé">

                                    Terminé

                                </option>

                            </select>

                        </div>



                        <!-- NOTES -->

                        <div class="col-12">

                            <label class="form-label">

                                Notes

                            </label>


                            <textarea id="lotNotes"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Informations complémentaires..."></textarea>

                        </div>


                    </div>


                </form>


            </div>



            <div class="modal-footer">


                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Annuler

                </button>


                <button type="button"
                        class="btn btn-success"
                        onclick="enregistrerLot()">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Enregistrer le lot

                </button>


            </div>


        </div>

    </div>

</div>



<!-- SCRIPTS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../../js/elevage.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    chargerLots();

});

</script>
<script src="../../js/elevage.js"></script>
</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../../js/supabase.js"></script>

<script src="../../js/elevage.js"></script>

<script src="../../js/lots-supabase.js"></script>
