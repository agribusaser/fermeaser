<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reproduction & Incubation | Ferme Asher ERP</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="../../css/elevage.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body class="bg-light">


<div class="container-fluid py-4">


<!-- EN-TÊTE -->

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2>

<i class="fa-solid fa-egg text-success"></i>

Reproduction & Incubation

</h2>

<p class="text-muted">

Gestion des œufs fécondés, incubations et éclosions.

</p>

</div>


<div>

<a
href="index.html"
class="btn btn-secondary me-2">

<i class="fa-solid fa-arrow-left"></i>

Retour

</a>


<button
class="btn btn-success"
data-bs-toggle="modal"
data-bs-target="#modalReproduction">

<i class="fa-solid fa-plus"></i>

Nouvelle incubation

</button>

</div>

</div>



<!-- STATISTIQUES -->

<div class="row mb-4">


<div class="col-lg-3 col-md-6 mb-3">

<div class="card shadow-sm border-0 text-center">

<div class="card-body">

<i class="fa-solid fa-egg fa-2x text-warning mb-2"></i>

<h3 id="oeufsIncubation">

0

</h3>

<p class="mb-0">

Œufs en incubation

</p>

</div>

</div>

</div>



<div class="col-lg-3 col-md-6 mb-3">

<div class="card shadow-sm border-0 text-center">

<div class="card-body">

<i class="fa-solid fa-calendar-check fa-2x text-primary mb-2"></i>

<h3 id="incubationsActives">

0

</h3>

<p class="mb-0">

Incubations actives

</p>

</div>

</div>

</div>



<div class="col-lg-3 col-md-6 mb-3">

<div class="card shadow-sm border-0 text-center">

<div class="card-body">

<i class="fa-solid fa-feather-pointed fa-2x text-success mb-2"></i>

<h3 id="totalEclosions">

0

</h3>

<p class="mb-0">

Animaux éclos

</p>

</div>

</div>

</div>



<div class="col-lg-3 col-md-6 mb-3">

<div class="card shadow-sm border-0 text-center">

<div class="card-body">

<i class="fa-solid fa-percent fa-2x text-danger mb-2"></i>

<h3 id="tauxEclosion">

0 %

</h3>

<p class="mb-0">

Taux d'éclosion

</p>

</div>

</div>

</div>


</div>



<!-- TABLEAU -->

<div class="card shadow-sm border-0">

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead class="table-success">

<tr>

<th>Code</th>

<th>Lot parent</th>

<th>Type</th>

<th>Date mise</th>

<th>Date prévue</th>

<th>Œufs</th>

<th>Éclos</th>

<th>Statut</th>

<th>Actions</th>

</tr>

</thead>


<tbody id="listeReproduction">

</tbody>


</table>

</div>

</div>

</div>


</div>



<!-- MODAL -->

<div
class="modal fade"
id="modalReproduction"
tabindex="-1">

<div class="modal-dialog modal-lg">

<div class="modal-content">


<div class="modal-header bg-success text-white">

<h5 class="modal-title">

<i class="fa-solid fa-egg"></i>

Nouvelle incubation

</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>



<div class="modal-body">


<form id="formReproduction">


<div class="row g-3">


<div class="col-md-6">

<label class="form-label">

Lot parent

</label>

<select
id="reproductionLot"
class="form-select"
required>

<option value="">

Sélectionner un lot

</option>

</select>

</div>



<div class="col-md-6">

<label class="form-label">

Type d'œufs

</label>

<input
type="text"
id="reproductionType"
class="form-control"
placeholder="Ex : Œufs de caille"
required>

</div>



<div class="col-md-4">

<label class="form-label">

Date de mise

</label>

<input
type="date"
id="reproductionDate"
class="form-control"
required>

</div>



<div class="col-md-4">

<label class="form-label">

Date prévue d'éclosion

</label>

<input
type="date"
id="reproductionDatePrevue"
class="form-control"
required>

</div>



<div class="col-md-4">

<label class="form-label">

Nombre d'œufs

</label>

<input
type="number"
id="reproductionOeufs"
class="form-control"
min="1"
required>

</div>



<div class="col-md-6">

<label class="form-label">

Couveuse

</label>

<input
type="text"
id="reproductionCouveuse"
class="form-control"
placeholder="Ex : Couveuse 1056 œufs">

</div>



<div class="col-md-6">

<label class="form-label">

Statut

</label>

<select
id="reproductionStatut"
class="form-select">

<option value="En incubation">

En incubation

</option>

<option value="Terminé">

Terminé

</option>

</select>

</div>



<div class="col-12">

<label class="form-label">

Notes

</label>

<textarea
id="reproductionNotes"
class="form-control"
rows="3">

</textarea>

</div>


</div>


</form>


</div>



<div class="modal-footer">

<button
type="button"
class="btn btn-secondary"
data-bs-dismiss="modal">

Annuler

</button>


<button
type="button"
class="btn btn-success"
onclick="enregistrerReproduction()">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer

</button>

</div>


</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">

</script>

<script src="../../js/elevage.js"></script>


<script>

document.addEventListener(
"DOMContentLoaded",
function () {

    document.getElementById("reproductionDate").value =
        new Date().toISOString().split("T")[0];

    chargerReproduction();

    chargerLotsReproduction();

});

</script>


</body>

</html>
