<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sortie de Stock | Ferme Asher ERP</title>


<!-- BOOTSTRAP -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- CSS -->

<link
rel="stylesheet"
href="../../css/stocks.css">


<!-- FONT AWESOME -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body class="bg-light">


<div class="container py-5">


<div class="row justify-content-center">


<div class="col-lg-8">


<div class="card shadow border-0">


<!-- HEADER -->

<div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">

<h3 class="mb-0">

<i class="fa-solid fa-circle-minus"></i>

Sortie de Stock

</h3>


<a
href="index.html"
class="btn btn-light">

<i class="fa-solid fa-arrow-left"></i>

Retour

</a>

</div>



<!-- CORPS -->

<div class="card-body p-4">


<form id="sortieForm">


<div class="row g-3">


<!-- DATE -->

<div class="col-md-6">

<label
for="date"
class="form-label">

Date

<span class="text-danger">*</span>

</label>


<input
type="date"
id="date"
class="form-control"
required>

</div>



<!-- PRODUIT -->

<div class="col-md-6">

<label
for="produit"
class="form-label">

Produit

<span class="text-danger">*</span>

</label>


<select
id="produit"
class="form-select"
required>

<option value="">

Chargement des produits...

</option>

</select>

</div>



<!-- STOCK DISPONIBLE -->

<div class="col-md-6">

<label
for="stockDisponible"
class="form-label">

Stock disponible

</label>


<input
type="number"
id="stockDisponible"
class="form-control"
readonly>

</div>



<!-- QUANTITE -->

<div class="col-md-6">

<label
for="quantite"
class="form-label">

Quantité à sortir

<span class="text-danger">*</span>

</label>


<input
type="number"
id="quantite"
class="form-control"
min="0.01"
step="0.01"
required>

</div>



<!-- PRIX -->

<div class="col-md-6">

<label
for="prix"
class="form-label">

Prix unitaire (FC)

</label>


<input
type="number"
id="prix"
class="form-control"
readonly>

</div>



<!-- MOTIF -->

<div class="col-md-6">

<label
for="type"
class="form-label">

Motif de sortie

<span class="text-danger">*</span>

</label>


<select
id="type"
class="form-select"
required>

<option value="">

Sélectionner le motif

</option>

<option value="Vente">

Vente

</option>

<option value="Transformation">

Transformation

</option>

<option value="Consommation élevage">

Consommation élevage

</option>

<option value="Consommation interne">

Consommation interne

</option>

<option value="Transfert">

Transfert vers un autre site

</option>

<option value="Perte / Casse">

Perte / Casse / Détérioration

</option>

<option value="Ajustement">

Ajustement

</option>

<option value="Autre">

Autre

</option>

</select>

</div>



<!-- REFERENCE -->

<div class="col-md-12">

<label
for="reference"
class="form-label">

Référence

</label>


<input
type="text"
id="reference"
class="form-control"
placeholder="Ex : Vente VNT-001">

</div>



<!-- OBSERVATION -->

<div class="col-md-12">

<label
for="observation"
class="form-label">

Observation

</label>


<textarea
id="observation"
class="form-control"
rows="4"
placeholder="Informations complémentaires...">

</textarea>

</div>


</div>


<!-- BOUTONS -->

<div class="d-flex justify-content-end gap-2 mt-4">


<button
type="reset"
class="btn btn-warning">

<i class="fa-solid fa-rotate-left"></i>

Réinitialiser

</button>


<button
type="submit"
class="btn btn-danger">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer la sortie

</button>


</div>


</form>


</div>

</div>

</div>

</div>

</div>


<!-- STOCKS JS -->

<script src="../../js/stocks.js"></script>


</body>

</html>
