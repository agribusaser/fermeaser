<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sortie de Stock | Ferme Asher ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../../css/stocks.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container py-5">

<div class="card shadow-lg">

<div class="card-header bg-danger text-white">

<h3>

<i class="fa-solid fa-arrow-up"></i>

Nouvelle sortie de stock

</h3>

</div>

<div class="card-body">

<form id="sortieForm">

  <div class="row">

<div class="col-md-6">

<label class="form-label">

Produit

</label>

<select

id="produit"

class="form-select"

required>

</select>

</div>

<div class="col-md-6">

<label class="form-label">

Date

</label>

<input

type="date"

id="date"

class="form-control"

required>

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<label>

Stock disponible

</label>

<input

type="number"

id="stockDisponible"

class="form-control"

readonly>

</div>

<div class="col-md-4">

<label>

Quantité sortie

</label>

<input

type="number"

id="quantite"

class="form-control"

min="1"

required>

</div>

<div class="col-md-4">

<label>

Valeur unitaire

</label>

<input

type="number"

id="prix"

class="form-control"

readonly>

</div>

</div>

<br>

  <div class="row">

<div class="col-md-6">

<label>

Type de sortie

</label>

<select

id="type"

class="form-select">

<option>Vente</option>

<option>Consommation interne</option>

<option>Perte</option>

<option>Casse</option>

<option>Correction</option>

<option>Autre</option>

</select>

</div>

<div class="col-md-6">

<label>

Référence

</label>

<input

type="text"

id="reference"

class="form-control"

placeholder="Facture, Bon de sortie...">

</div>

</div>

<br>

<label>

Observation

</label>

<textarea

id="observation"

rows="4"

class="form-control">

</textarea>

<br>

  <div class="text-end">

<a

href="index.html"

class="btn btn-secondary">

Retour

</a>

<button

type="reset"

class="btn btn-warning">

Annuler

</button>

<button

type="submit"

class="btn btn-danger">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer

</button>

</div>

</form>

</div>

</div>

</div>

  <script src="../../js/stocks.js"></script>

<script>

chargerListeProduits();

dateAujourdhui();

chargerInformationsProduit();

</script>

  </body>

</html>
