<body>


<div class="wrapper">

<main class="main">


<header class="topbar">


<div>


<h1>

</h1>

Enregistrer une nouvelle transaction

  <!-- ================================= -->
<!-- FORMULAIRE NOUVELLE VENTE -->
<!-- ================================= -->

<section class="panel">


<h2>

<i class="fa-solid fa-cart-plus"></i>

Informations de la vente

</h2>



<form id="formVente">



<div class="row g-4">



<!-- CLIENT -->

<div class="col-lg-6">


<label class="form-label">

Client

</label>


<select 
class="form-select"
id="client">


<option value="">

Sélectionner un client

</option>


<option>

Restaurant ABC

</option>


<option>

Supermarché Espoir

</option>


<option>

Client particulier

</option>


</select>


</div>





<!-- DATE -->

<div class="col-lg-6">


<label class="form-label">

Date de vente

</label>


<input

type="date"

class="form-control"

id="dateVente"

>


</div>





<!-- PRODUIT -->

<div class="col-lg-6">


<label class="form-label">

Produit

</label>


<select

class="form-select"

id="produit"


onchange="calculerTotal()"

>


<option value="">

Choisir un produit

</option>


<option 

data-prix="9000">

Plateau de 15 œufs

</option>


<option

data-prix="6000">

Cailles vivantes

</option>


<option

data-prix="9000">

Œufs de cailles

</option>


<option

data-prix="50000">

Sac de soja

</option>


</select>


</div>





<!-- QUANTITE -->

<div class="col-lg-6">


<label class="form-label">

Quantité

</label>


<input

type="number"

class="form-control"

id="quantite"

value="1"

min="1"

oninput="calculerTotal()"

>


</div>





<!-- PRIX -->

<div class="col-lg-6">


<label class="form-label">

Prix unitaire

</label>


<input

type="number"

class="form-control"

id="prix"

readonly

>


</div>





<!-- TOTAL -->

<div class="col-lg-6">


<label class="form-label">

Montant total

</label>


<input

type="number"

class="form-control"

id="total"

readonly

>


</div>





<!-- PAIEMENT -->

<div class="col-lg-6">


<label class="form-label">

Mode de paiement

</label>


<select

class="form-select"

id="paiement"

>


<option>

Cash

</option>


<option>

Mobile Money

</option>


<option>

Banque

</option>


<option>

Crédit

</option>


</select>


</div>





<!-- STATUT -->

<div class="col-lg-6">


<label class="form-label">

Statut

</label>


<select

class="form-select"

id="statut"

>


<option>

Payée

</option>


<option>

En attente

</option>


<option>

Annulée

</option>


</select>


</div>


</div>





<hr class="my-4">





<div class="d-flex gap-3">


<button

type="submit"

class="btn btn-success btn-lg"

>


<i class="fa-solid fa-check"></i>

Enregistrer la vente


</button>




<a

href="index.html"

class="btn btn-secondary btn-lg"

>


<i class="fa-solid fa-arrow-left"></i>

Retour


</a>


</div>



</form>



</section>

  <script>

// =====================================
// Date du jour
// =====================================

document.addEventListener("DOMContentLoaded", function(){

    const date = document.getElementById("dateVente");

    if(date){

        date.value = new Date().toISOString().split("T")[0];

    }

});


// =====================================
// Calcul automatique
// =====================================

function calculerTotal(){

    const produit = document.getElementById("produit");

    const prix = document.getElementById("prix");

    const quantite = document.getElementById("quantite");

    const total = document.getElementById("total");

    if(produit.selectedIndex <= 0){

        prix.value="";

        total.value="";

        return;

    }

    const prixUnitaire =
    Number(
        produit.options[
            produit.selectedIndex
        ].dataset.prix
    );

    prix.value = prixUnitaire;

    total.value =
        prixUnitaire *
        Number(quantite.value);

}


// =====================================
// Générer un numéro de facture
// =====================================

function genererFacture(){

    const numero =
        Math.floor(
            Math.random()*900000
        )+100000;

    return "FA-"+numero;

}


// =====================================
// Enregistrer la vente
// =====================================

document
.getElementById("formVente")
.addEventListener("submit",

function(e){

    e.preventDefault();

    const vente = {

        facture:genererFacture(),

        date:
        document.getElementById("dateVente").value,

        client:
        document.getElementById("client").value,

        produit:
        document.getElementById("produit").value,

        quantite:
        Number(
            document.getElementById("quantite").value
        ),

        prix:
        Number(
            document.getElementById("prix").value
        ),

        total:
        Number(
            document.getElementById("total").value
        ),

        paiement:
        document.getElementById("paiement").value,

        statut:
        document.getElementById("statut").value

    };


    console.table(vente);

    alert(

        "Vente enregistrée !\n\n"

        +

        vente.facture

    );


    // Future Version :
    // Enregistrement dans ventes.json
    // Mise à jour Dashboard
    // Mise à jour Stock
    // Mise à jour Finances


    this.reset();

});


</script>

</main>

</div>

</body>

</html>
