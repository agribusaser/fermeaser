<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nouvelle Vente | Ferme Asher ERP</title>


    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- CSS DU MODULE -->

    <link
        rel="stylesheet"
        href="../../css/ventes.css">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body class="bg-light">


<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">


<!-- =========================================
     CARTE PRINCIPALE
========================================= -->

<div class="card shadow-lg border-0">


<!-- =========================================
     EN-TÊTE
========================================= -->

<div class="card-header bg-success text-white d-flex justify-content-between align-items-center">

    <h3 class="mb-0">

        <i class="fa-solid fa-cart-plus"></i>

        Nouvelle Vente

    </h3>


    <a
        href="index.html"
        class="btn btn-light">

        <i class="fa-solid fa-arrow-left"></i>

        Retour

    </a>

</div>


<!-- =========================================
     CORPS
========================================= -->

<div class="card-body">


<form id="venteForm">


<!-- =========================================
     CLIENT
========================================= -->

<div class="row g-3">


<div class="col-md-6">

    <label
        for="client"
        class="form-label">

        Nom du client
        <span class="text-danger">*</span>

    </label>


    <input
        type="text"
        class="form-control"
        id="client"
        placeholder="Nom complet du client"
        required>

</div>


<div class="col-md-6">

    <label
        for="telephone"
        class="form-label">

        Téléphone

    </label>


    <input
        type="text"
        class="form-control"
        id="telephone"
        placeholder="Ex : +243 000 000 000">

</div>

</div>


<!-- =========================================
     PRODUIT / QUANTITE / PRIX
========================================= -->

<div class="row g-3 mt-2">


<div class="col-md-6">

    <label
        for="produit"
        class="form-label">

        Produit
        <span class="text-danger">*</span>

    </label>


    <select
        class="form-select"
        id="produit"
        required>

        <option value="">

            Sélectionner un produit

        </option>

    </select>

</div>


<div class="col-md-3">

    <label
        for="quantite"
        class="form-label">

        Quantité
        <span class="text-danger">*</span>

    </label>


    <input
        type="number"
        id="quantite"
        class="form-control"
        value="1"
        min="1"
        required>

</div>


<div class="col-md-3">

    <label
        for="prix"
        class="form-label">

        Prix unitaire

    </label>


    <input
        type="number"
        id="prix"
        class="form-control"
        min="0"
        required>

</div>

</div>


<!-- =========================================
     REMISE / PAIEMENT / DATE
========================================= -->

<div class="row g-3 mt-2">


<div class="col-md-4">

    <label
        for="remise"
        class="form-label">

        Remise

    </label>


    <input
        type="number"
        class="form-control"
        id="remise"
        value="0"
        min="0">

</div>


<div class="col-md-4">

    <label
        for="paiement"
        class="form-label">

        Mode de paiement

    </label>


    <select
        class="form-select"
        id="paiement">

        <option value="Espèces">

            Espèces

        </option>


        <option value="Mobile Money">

            Mobile Money

        </option>


        <option value="Banque">

            Banque

        </option>

    </select>

</div>


<div class="col-md-4">

    <label
        for="date"
        class="form-label">

        Date

    </label>


    <input
        type="date"
        id="date"
        class="form-control"
        required>

</div>

</div>


<!-- =========================================
     TOTAL
========================================= -->

<div class="alert alert-success mt-4 mb-4">

    <div class="d-flex justify-content-between align-items-center">

        <strong>

            TOTAL À PAYER

        </strong>


        <h3 class="mb-0">

            <span id="total">

                0 FC

            </span>

        </h3>

    </div>

</div>


<!-- =========================================
     BOUTONS
========================================= -->

<div class="d-flex justify-content-end gap-2">


<button
    type="reset"
    class="btn btn-warning">

    <i class="fa-solid fa-rotate-left"></i>

    Réinitialiser

</button>


<button
    type="submit"
    class="btn btn-success">

    <i class="fa-solid fa-floppy-disk"></i>

    Enregistrer la vente

</button>


</div>


</form>


</div>

</div>

</div>

</div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="../../js/ventes.js"></script>


</body>

</html>
