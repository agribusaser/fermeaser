<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nouvelle Vente | Ferme Asher ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../../css/ventes.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-light">

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card shadow-lg border-0">

<div class="card-header bg-success text-white">

<h3>

<i class="fa-solid fa-cart-plus"></i>

Nouvelle Vente

</h3>

</div>

<div class="card-body">

<form id="venteForm">

<div class="row">

<div class="col-md-6">

<label class="form-label">

Nom du client

</label>

<input

type="text"

class="form-control"

id="client"

required>

</div>

<div class="col-md-6">

<label class="form-label">

Téléphone

</label>

<input

type="text"

class="form-control"

id="telephone">

</div>

</div>

<br>

<div class="row">

<div class="col-md-6">

<label class="form-label">

Produit

</label>

<select

class="form-select"

id="produit"

required>

<option value="">

Sélectionner

</option>

<option>

Œufs de caille

</option>

<option>

Cailles

</option>

<option>

Soja

</option>

<option>

Farine enrichie

</option>

</select>

</div>

<div class="col-md-3">

<label>

Quantité

</label>

<input

type="number"

id="quantite"

class="form-control"

value="1">

</div>

<div class="col-md-3">

<label>

Prix unitaire

</label>

<input

type="number"

id="prix"

class="form-control">

</div>

</div>

<br>

  <div class="row">

<div class="col-md-4">

<label>

Remise

</label>

<input

type="number"

class="form-control"

id="remise"

value="0">

</div>

<div class="col-md-4">

<label>

Paiement

</label>

<select

class="form-select"

id="paiement">

<option>

Espèces

</option>

<option>

Mobile Money

</option>

<option>

Banque

</option>

</select>

</div>

<div class="col-md-4">

<label>

Date

</label>

<input

type="date"

id="date"

class="form-control">

</div>

</div>

<br>

<div class="alert alert-success">

<h3>

Total :

<span id="total">

0 FC

</span>

</h3>

</div>

<div class="text-end">

<a

href="index.html"

class="btn btn-secondary">

Retour

</a>

<button

type="reset"

class="btn btn-warning">

Annuler

</button>

<button

type="submit"

class="btn btn-success">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

  <script src="../../js/ventes.js"></script>

<script>

document.getElementById("date").valueAsDate=new Date();

</script>

</body>

</html>
