<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des Ventes | Ferme Asher ERP</title>


    <!-- ==================================================
         BOOTSTRAP
    ================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ==================================================
         CSS VENTES
    ================================================== -->

    <link
        rel="stylesheet"
        href="../../css/ventes.css">


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- ==================================================
         STYLE RESPONSIVE
    ================================================== -->

    <style>

        /* ==================================================
           BASE
        ================================================== */

        html,
        body {

            width: 100%;

            min-height: 100%;

            margin: 0;

            padding: 0;

            overflow-x: hidden;

        }


        body {

            background: #f4f7fb;

        }


        /* ==================================================
           CONTENEUR
        ================================================== */

        .container-fluid {

            width: 100%;

            max-width: 100%;

        }


        /* ==================================================
           EN-TÊTE
        ================================================== */

        .card-header {

            gap: 15px;

        }


        /* ==================================================
           TABLEAU RESPONSIVE
           
           IMPORTANT :
           Le tableau est plus large que l'écran.
           Le doigt peut le faire glisser horizontalement.
        ================================================== */

        .table-responsive {

            width: 100% !important;

            max-width: 100% !important;

            overflow-x: auto !important;

            overflow-y: hidden !important;

            -webkit-overflow-scrolling: touch !important;

            touch-action: pan-x !important;

            scrollbar-width: auto;

        }


        /* ==================================================
           LARGEUR DU TABLEAU
        ================================================== */

        .table-responsive table {

            min-width: 1100px !important;

            width: 1100px !important;

            margin-bottom: 0;

        }


        /* ==================================================
           CELLULES
        ================================================== */

        .table-responsive th,
        .table-responsive td {

            white-space: nowrap !important;

            vertical-align: middle;

        }


        /* ==================================================
           BARRE DE DEFILEMENT NATIVE
        ================================================== */

        .table-responsive::-webkit-scrollbar {

            height: 12px;

        }


        .table-responsive::-webkit-scrollbar-track {

            background: #e8f5e9;

            border-radius: 10px;

        }


        .table-responsive::-webkit-scrollbar-thumb {

            background: #2e7d32;

            border-radius: 10px;

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 768px) {


            /* ----------------------------------------------
               CONTENEUR
            ---------------------------------------------- */

            .container-fluid {

                padding: 10px !important;

            }


            /* ----------------------------------------------
               CARTE
            ---------------------------------------------- */

            .card {

                width: 100% !important;

                margin: 0 !important;

                border-radius: 15px !important;

            }


            /* ----------------------------------------------
               EN-TÊTE
            ---------------------------------------------- */

            .card-header {

                display: flex !important;

                flex-direction: column !important;

                align-items: stretch !important;

                padding: 18px !important;

                gap: 15px !important;

            }


            .card-header h3 {

                margin: 0 !important;

                font-size: 22px !important;

                text-align: center;

            }


            .card-header .btn {

                width: 100% !important;

                margin: 0 !important;

            }


            /* ----------------------------------------------
               CORPS
            ---------------------------------------------- */

            .card-body {

                padding: 15px !important;

            }


            /* ----------------------------------------------
               FILTRES
            ---------------------------------------------- */

            .row.mb-4 {

                margin-left: 0 !important;

                margin-right: 0 !important;

            }


            .row.mb-4 > div {

                width: 100% !important;

                padding-left: 0 !important;

                padding-right: 0 !important;

                margin-bottom: 10px !important;

            }


            #recherche,
            #filtreDate {

                width: 100% !important;

                height: 48px;

            }


            .row.mb-4 button {

                width: 100% !important;

                height: 48px;

            }


            /* ----------------------------------------------
               TOTAL
            ---------------------------------------------- */

            .row.mb-4 .text-end {

                text-align: center !important;

            }


            .row.mb-4 h4 {

                margin: 5px 0 0 0 !important;

                font-size: 20px !important;

            }


            /* ----------------------------------------------
               TABLEAU
            ---------------------------------------------- */

            .table-responsive {

                display: block !important;

                width: 100% !important;

                max-width: 100% !important;

                margin-top: 15px;

                overflow-x: auto !important;

                overflow-y: hidden !important;

                -webkit-overflow-scrolling: touch !important;

                touch-action: pan-x !important;

                border: 1px solid #dee2e6;

                border-radius: 10px;

            }


            .table-responsive table {

                display: table !important;

                width: 1100px !important;

                min-width: 1100px !important;

                max-width: none !important;

                font-size: 14px;

            }


            .table-responsive th {

                padding: 12px 10px !important;

                font-size: 14px;

            }


            .table-responsive td {

                padding: 12px 10px !important;

                font-size: 14px;

            }


            /* ----------------------------------------------
               ACTIONS
            ---------------------------------------------- */

            .table-responsive th:last-child,
            .table-responsive td:last-child {

                min-width: 240px;

            }

        }


        /* ==================================================
           PETITS TELEPHONES
        ================================================== */

        @media (max-width: 576px) {


            .container-fluid {

                padding: 8px !important;

            }


            .card {

                border-radius: 12px !important;

            }


            .card-header {

                padding: 15px !important;

            }


            .card-header h3 {

                font-size: 20px !important;

            }


            .card-body {

                padding: 12px !important;

            }


            .row.mb-4 h4 {

                font-size: 18px !important;

            }


            /* TABLEAU */

            .table-responsive {

                width: 100% !important;

                overflow-x: auto !important;

                overflow-y: hidden !important;

                -webkit-overflow-scrolling: touch !important;

                touch-action: pan-x !important;

            }


            .table-responsive table {

                width: 1100px !important;

                min-width: 1100px !important;

            }


        }


    </style>

</head>


<body class="bg-light">


<!-- ==================================================
     CONTENEUR PRINCIPAL
================================================== -->

<div class="container-fluid py-4">


    <div class="card shadow-lg border-0">


        <!-- ==================================================
             EN-TÊTE
        ================================================== -->

        <div
            class="card-header bg-success text-white d-flex justify-content-between align-items-center">


            <h3 class="mb-0">

                <i class="fa-solid fa-cash-register"></i>

                Gestion des ventes

            </h3>


            <a
                href="nouvelle.html"
                class="btn btn-warning">


                <i class="fa-solid fa-plus"></i>

                Nouvelle Vente


            </a>


        </div>


        <!-- ==================================================
             CORPS
        ================================================== -->

        <div class="card-body">


            <!-- ==================================================
                 RECHERCHE ET FILTRES
            ================================================== -->

            <div class="row mb-4">


                <!-- RECHERCHE -->

                <div class="col-md-4 mb-2">

                    <input
                        type="text"
                        id="recherche"
                        class="form-control"
                        placeholder="Rechercher un client ou un produit">

                </div>


                <!-- DATE -->

                <div class="col-md-3 mb-2">

                    <input
                        type="date"
                        id="filtreDate"
                        class="form-control">

                </div>


                <!-- ACTUALISER -->

                <div class="col-md-2 mb-2">

                    <button
                        type="button"
                        class="btn btn-success w-100"
                        onclick="chargerVentes()">

                        <i class="fa-solid fa-rotate"></i>

                        Actualiser

                    </button>

                </div>


                <!-- TOTAL -->

                <div class="col-md-3 text-end">

                    <h4>

                        Total :

                        <span id="nombreVentes">

                            0

                        </span>

                        ventes

                    </h4>

                </div>


            </div>


            <!-- ==================================================
                 TABLEAU
            ================================================== -->

            <div class="table-responsive">


                <table
                    class="table table-striped table-hover align-middle">


                    <thead class="table-success">


                        <tr>


                            <th>
                                ID
                            </th>


                            <th>
                                Date
                            </th>


                            <th>
                                Client
                            </th>


                            <th>
                                Produit
                            </th>


                            <th>
                                Qté
                            </th>


                            <th>
                                Total
                            </th>


                            <th>
                                Paiement
                            </th>


                            <th>
                                Statut
                            </th>


                            <th style="min-width:240px;">
                                Actions
                            </th>


                        </tr>


                    </thead>


                    <tbody id="tableVentes">


                    </tbody>


                </table>


            </div>


        </div>


    </div>


</div>


<!-- ==================================================
     BOOTSTRAP
================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ==================================================
     SUPABASE
================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script
    src="../../js/supabase.js">
</script>


<!-- ==================================================
     PERMISSIONS
================================================== -->

<script
    src="../../js/permissions.js">
</script>


<!-- ==================================================
     VENTES
================================================== -->

<script
    src="../../js/ventes.js">
</script>


</body>

</html>
