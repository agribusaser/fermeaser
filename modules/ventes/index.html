<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion des Ventes | Ferme Asher ERP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../../css/ventes.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="bg-light">

<div class="container-fluid py-4">

<div class="card shadow-lg border-0">

<div class="card-header bg-success text-white d-flex justify-content-between align-items-center">

<h3 class="mb-0">

<i class="fa-solid fa-cash-register"></i>

Gestion des ventes

</h3>

<a href="nouvelle.html" class="btn btn-warning">

<i class="fa-solid fa-plus"></i>

Nouvelle Vente

</a>

</div>

<div class="card-body">

<div class="row mb-4">

<div class="col-md-4 mb-2">

<input
type="text"
id="recherche"
class="form-control"
placeholder="Rechercher un client ou un produit">

</div>

<div class="col-md-3 mb-2">

<input
type="date"
id="filtreDate"
class="form-control">

</div>

<div class="col-md-2 mb-2">

<button
type="button"
class="btn btn-success w-100"
onclick="chargerVentes()">

<i class="fa-solid fa-rotate"></i>

Actualiser

</button>

</div>

<div class="col-md-3 text-end">

<h4>

Total :

<span id="nombreVentes">

0

</span>

ventes

</h4>

</div>

</div>

<div class="table-responsive">

<table class="table table-striped table-hover align-middle">

<thead class="table-success">

<tr>

<th>ID</th>

<th>Date</th>

<th>Client</th>

<th>Produit</th>

<th>Qté</th>

<th>Total</th>

<th>Paiement</th>

<th>Statut</th>

<th width="240">

Actions

</th>

</tr>

</thead>

<tbody id="tableVentes">

</tbody>

</table>

</div>

</div>

</div>

</div>

<script src="../../js/stocks.js"></script>

<script src="../../js/ventes.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    chargerVentes();

});

</script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    chargerVentes();

});

</script>

</body>

</html>
