    <!-- ==================================================
         CSS MOBILE
    ================================================== -->

    <style>

        /* ==================================================
           BASE
        ================================================== */

        html,
        body {

            width: 100%;
            min-height: 100%;

            margin: 0;
            padding: 0;

            overflow-x: hidden;

        }


        body {

            background: #f4f7fb;

        }


        /* ==================================================
           CONTENEUR PRINCIPAL
        ================================================== */

        .container-fluid {

            width: 100%;
            max-width: 100%;

        }


        /* ==================================================
           CARTE PRINCIPALE
        ================================================== */

        .card {

            width: 100%;

        }


        /* ==================================================
           EN-TÊTE
        ================================================== */

        .card-header {

            gap: 15px;

        }


        /* ==================================================
           TABLEAU
        ================================================== */

        .table-responsive {

            width: 100% !important;

            max-width: 100% !important;

            overflow-x: auto !important;

            overflow-y: hidden !important;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: auto;

            scrollbar-color:
                #2E7D32
                #E8F5E9;

        }


        /* ==================================================
           TABLEAU LARGE
        ================================================== */

        .table-responsive table {

            width: 1100px !important;

            min-width: 1100px !important;

            margin-bottom: 0;

        }


        .table-responsive th,
        .table-responsive td {

            white-space: nowrap;

            vertical-align: middle;

        }


        /* ==================================================
           BARRE DE DEFILEMENT DU TABLEAU
        ================================================== */

        .table-responsive::-webkit-scrollbar {

            height: 14px;

        }


        .table-responsive::-webkit-scrollbar-track {

            background: #E8F5E9;

            border-radius: 10px;

        }


        .table-responsive::-webkit-scrollbar-thumb {

            background: #2E7D32;

            border-radius: 10px;

            border: 2px solid #E8F5E9;

        }


        .table-responsive::-webkit-scrollbar-thumb:hover {

            background: #1B5E20;

        }


        /* ==================================================
           BARRE DE DEFILEMENT SECONDAIRE
        ================================================== */

        .table-scrollbar {

            width: 100%;

            height: 20px;

            margin-top: 10px;

            overflow-x: auto;

            overflow-y: hidden;

            background: #E8F5E9;

            border-radius: 10px;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: auto;

            scrollbar-color:
                #2E7D32
                #E8F5E9;

        }


        .table-scrollbar-content {

            width: 1100px;

            min-width: 1100px;

            height: 1px;

        }


        .table-scrollbar::-webkit-scrollbar {

            height: 18px;

        }


        .table-scrollbar::-webkit-scrollbar-track {

            background: #E8F5E9;

            border-radius: 10px;

        }


        .table-scrollbar::-webkit-scrollbar-thumb {

            background: #2E7D32;

            border-radius: 10px;

            border: 2px solid #E8F5E9;

        }


        /* ==================================================
           DESKTOP
        ================================================== */

        @media (min-width: 769px) {

            .table-scrollbar {

                display: none;

            }

        }


        /* ==================================================
           TABLETTE
        ================================================== */

        @media (max-width: 768px) {


            /* CONTENEUR */

            .container-fluid {

                padding: 10px !important;

            }


            /* CARTE */

            .card {

                width: 100% !important;

                margin: 0 !important;

                border-radius: 15px !important;

            }


            /* ----------------------------------------------
               EN-TÊTE
            ---------------------------------------------- */

            .card-header {

                display: flex !important;

                flex-direction: column !important;

                align-items: stretch !important;

                padding: 18px !important;

                gap: 15px !important;

            }


            .card-header h3 {

                margin: 0 !important;

                font-size: 22px !important;

                text-align: center;

            }


            .card-header .btn {

                width: 100% !important;

                margin: 0 !important;

            }


            /* ----------------------------------------------
               CORPS
            ---------------------------------------------- */

            .card-body {

                padding: 15px !important;

            }


            /* ----------------------------------------------
               FILTRES
            ---------------------------------------------- */

            .row.mb-4 {

                margin-left: 0 !important;

                margin-right: 0 !important;

            }


            .row.mb-4 > div {

                width: 100% !important;

                padding-left: 0 !important;

                padding-right: 0 !important;

                margin-bottom: 10px !important;

            }


            #recherche,
            #filtreDate {

                width: 100% !important;

                height: 48px;

            }


            .row.mb-4 button {

                width: 100% !important;

                height: 48px;

            }


            /* ----------------------------------------------
               TOTAL
            ---------------------------------------------- */

            .row.mb-4 .text-end {

                text-align: center !important;

            }


            .row.mb-4 h4 {

                margin: 5px 0 0 0 !important;

                font-size: 20px !important;

            }


            /* ----------------------------------------------
               TABLEAU
            ---------------------------------------------- */

            .table-responsive {

                width: 100% !important;

                margin-top: 15px;

                overflow-x: auto !important;

                overflow-y: hidden !important;

                border: 1px solid #DEE2E6;

                border-radius: 10px;

            }


            .table-responsive table {

                width: 1100px !important;

                min-width: 1100px !important;

                font-size: 14px;

            }


            .table-responsive th {

                padding: 12px 10px !important;

                font-size: 14px;

            }


            .table-responsive td {

                padding: 12px 10px !important;

            }


            /* ----------------------------------------------
               ACTIONS
            ---------------------------------------------- */

            .table-responsive th:last-child,
            .table-responsive td:last-child {

                min-width: 240px;

            }


            /* ----------------------------------------------
               BARRE SECONDAIRE
            ---------------------------------------------- */

            .table-scrollbar {

                display: block;

            }

        }


        /* ==================================================
           PETITS TELEPHONES
        ================================================== */

        @media (max-width: 576px) {

            .card-header {

            }

<!-- ==================================================
     SYNCHRONISATION DU DEFILEMENT
================================================== -->

<script>

(function () {


    function initialiserDefilement() {


        const tableau =
            document.getElementById(
                "tableVentesContainer"
            );


        const barre =
            document.getElementById(
                "barreDefilement"
            );


        const contenu =
            document.getElementById(
                "barreDefilementContenu"
            );


        if (
            !tableau ||
            !barre ||
            !contenu
        ) {

            return;

        }


        function synchroniser() {


            const largeur =
                Math.max(
                    tableau.scrollWidth,
                    1100
                );


            contenu.style.width =
                largeur + "px";


            /*
             * La barre secondaire suit
             * la position du tableau.
             */

            barre.scrollLeft =
                tableau.scrollLeft;

        }


        /* ----------------------------------------------
           TABLEAU → BARRE
        ---------------------------------------------- */

        tableau.addEventListener(
            "scroll",
            function () {

                if (
                    Math.abs(
                        barre.scrollLeft -
                        tableau.scrollLeft
                    ) > 1
                ) {

                    barre.scrollLeft =
                        tableau.scrollLeft;

                }

            }
        );


        /* ----------------------------------------------
           BARRE → TABLEAU
        ---------------------------------------------- */

        barre.addEventListener(
            "scroll",
            function () {

                if (
                    Math.abs(
                        tableau.scrollLeft -
                        barre.scrollLeft
                    ) > 1
                ) {

                    tableau.scrollLeft =
                        barre.scrollLeft;

                }

            }
        );


        /* ----------------------------------------------
           NOUVELLES LIGNES
        ---------------------------------------------- */

        const tbody =
            document.getElementById(
                "tableVentes"
            );


        if (tbody) {

            const observer =
                new MutationObserver(
                    function () {

                        setTimeout(
                            synchroniser,
                            100
                        );

                    }
                );


            observer.observe(
                tbody,
                {
                    childList: true,
                    subtree: true
                }
            );

        }


        /* ----------------------------------------------
           INITIALISATION
        ---------------------------------------------- */

        setTimeout(
            synchroniser,
            300
        );


        setTimeout(
            synchroniser,
            1000
        );


    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initialiserDefilement
        );

    } else {

        initialiserDefilement();

    }


})();

</script>
