<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Récoltes | Ferme Asher ERP</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body class="bg-light">

<div class="container-fluid py-4">


<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2 class="text-success">

<i class="fa-solid fa-basket-shopping"></i>

Récoltes

</h2>

<p class="text-muted">

Enregistrez vos récoltes et suivez vos rendements.

</p>

</div>


<a
href="index.html"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Retour

</a>

</div>



<div class="row mb-4">


<div class="col-md-4">

<div class="card text-center shadow-sm">

<div class="card-body">

<h3 id="nombreRecoltes">

0

</h3>

<p>Récoltes enregistrées</p>

</div>

</div>

</div>



<div class="col-md-4">

<div class="card text-center shadow-sm">

<div class="card-body">

<h3 id="quantiteRecoltee">

0 Kg

</h3>

<p>Production totale</p>

</div>

</div>

</div>



<div class="col-md-4">

<button
class="btn btn-success w-100 h-100"
data-bs-toggle="modal"
data-bs-target="#modalRecolte">

<i class="fa-solid fa-plus"></i>

Nouvelle récolte

</button>

</div>


</div>



<div class="card shadow-sm">

<div class="card-body">


<div class="table-responsive">

<table class="table table-hover">

<thead class="table-success">

<tr>

<th>Date</th>

<th>Culture</th>

<th>Parcelle</th>

<th>Quantité</th>

<th>Unité</th>

<th>Responsable</th>

<th>Action</th>

</tr>

</thead>


<tbody id="listeRecoltes">

</tbody>

</table>

</div>


</div>

</div>



<div
class="modal fade"
id="modalRecolte">


<div class="modal-dialog">


<div class="modal-content">


<div class="modal-header bg-success text-white">

<h5>

Nouvelle récolte

</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>



<div class="modal-body">


<form id="formRecolte">


<div class="mb-3">

<label>Date</label>

<input
type="date"
id="dateRecolte"
class="form-control"
required>

</div>



<div class="mb-3">

<label>Culture</label>

<input
type="text"
id="cultureRecolte"
class="form-control"
required>

</div>



<div class="mb-3">

<label>Parcelle</label>

<input
type="text"
id="parcelleRecolte"
class="form-control">

</div>



<div class="mb-3">

<label>Quantité</label>

<input
type="number"
id="quantiteRecolte"
class="form-control"
required>

</div>



<div class="mb-3">

<label>Unité</label>

<select
id="uniteRecolte"
class="form-select">

<option>Kg</option>

<option>Sac</option>

<option>Tonne</option>

<option>Unité</option>

</select>

</div>



<div class="mb-3">

<label>Responsable</label>

<input
type="text"
id="responsableRecolte"
class="form-control">

</div>


</form>


</div>



<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Annuler

</button>


<button
class="btn btn-success"
onclick="ajouterRecolte()">

Enregistrer

</button>

</div>


</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">

</script>

<script src="../../js/agriculture.js"></script>

</body>

</html>
