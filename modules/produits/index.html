<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Gestion des Produits | Ferme Asher ERP
</title>


<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<link
rel="stylesheet"
href="../../css/produits.css">

</head>


<body class="bg-light">


<div class="container-fluid py-4">


<div class="card shadow-lg border-0">


<div
class="card-header bg-success text-white d-flex justify-content-between align-items-center">


<h3 class="mb-0">

<i class="fa-solid fa-box"></i>

Gestion des Produits

</h3>


<a
href="nouveau.html"
class="btn btn-warning">

<i class="fa-solid fa-plus"></i>

Nouveau Produit

</a>


</div>


<div class="card-body">


<div class="row mb-4">


<div class="col-md-5">

<input
type="text"
id="recherche"
class="form-control"
placeholder="Rechercher un produit..."
oninput="chargerProduits()">

</div>


<div class="col-md-3">

<select
id="filtreCategorie"
class="form-select"
onchange="chargerProduits()">

<option value="">

Toutes les catégories

</option>

<option value="Élevage">

Élevage

</option>

<option value="Agriculture">

Agriculture

</option>

<option value="Alimentation">

Alimentation

</option>

<option value="Transformation">

Transformation

</option>

<option value="Autres">

Autres

</option>

</select>

</div>


<div class="col-md-2">

<button
class="btn btn-success w-100"
onclick="chargerProduits()">

<i class="fa-solid fa-rotate"></i>

Actualiser

</button>

</div>


<div class="col-md-2 text-end">

<h5>

Total :

<span id="nombreProduits">

0

</span>

produits

</h5>

</div>


</div>


<div class="table-responsive">


<table
class="table table-striped table-hover align-middle">


<thead class="table-success">


<tr>

<th>Code</th>

<th>Produit</th>

<th>Catégorie</th>

<th>Stock</th>

<th>Minimum</th>

<th>Unité</th>

<th>Prix</th>

<th>État</th>

<th>Actions</th>

</tr>


</thead>


<tbody id="tableProduits">


</tbody>


</table>


</div>


</div>


</div>


</div>


<script src="../../js/produits.js"></script>


</body>

</html>
