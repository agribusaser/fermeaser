<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Modifier Produit | Ferme Asher ERP
</title>


<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body class="bg-light">


<div class="container py-5">


<div class="row justify-content-center">


<div class="col-lg-8">


<div class="card shadow-lg border-0">


<div class="card-header bg-warning">


<h3 class="mb-0">

<i class="fa-solid fa-pen"></i>

Modifier le produit

</h3>


</div>


<div class="card-body">


<form
id="modifierProduitForm"
onsubmit="modifierProduit(event)">


<input
type="hidden"
id="idProduit">


<div class="row g-3">


<div class="col-md-6">

<label class="form-label">

Nom du produit

</label>


<input
type="text"
id="nom"
class="form-control"
required>

</div>


<div class="col-md-6">

<label class="form-label">

Catégorie

</label>


<select
id="categorie"
class="form-select">


<option value="Élevage">

Élevage

</option>


<option value="Agriculture">

Agriculture

</option>


<option value="Alimentation">

Alimentation

</option>


<option value="Transformation">

Transformation

</option>


<option value="Autres">

Autres

</option>


</select>

</div>


<div class="col-md-4">

<label class="form-label">

Prix unitaire

</label>


<input
type="number"
id="prix"
class="form-control">

</div>


<div class="col-md-4">

<label class="form-label">

Stock

</label>


<input
type="number"
id="stock"
class="form-control">

</div>


<div class="col-md-4">

<label class="form-label">

Stock minimum

</label>


<input
type="number"
id="minimum"
class="form-control">

</div>


<div class="col-md-6">

<label class="form-label">

Unité

</label>


<select
id="unite"
class="form-select">


<option value="Unité">

Unité

</option>


<option value="Kg">

Kg

</option>


<option value="Sac">

Sac

</option>


<option value="Plateau">

Plateau

</option>


<option value="Litre">

Litre

</option>


</select>

</div>


<div class="col-md-6">

<label class="form-label">

Description

</label>


<textarea
id="description"
class="form-control"
rows="3"></textarea>

</div>


</div>


<hr class="my-4">


<div class="text-end">


<a
href="index.html"
class="btn btn-secondary">

Retour

</a>


<button
type="submit"
class="btn btn-warning">

<i class="fa-solid fa-floppy-disk"></i>

Enregistrer les modifications

</button>


</div>


</form>


</div>


</div>


</div>


</div>


</div>


<script src="../../js/produits.js"></script>


</body>

</html>
